# `cargo deny check advisories` (CI): the RustSec advisories for Cargo.lock.
# Every ignored advisory says why it does not affect 2Secret; remove it once
# the fixed version is in.
# "Unsound" advisories count only for crates the workspace depends on
# directly (cargo-deny's default), so glib 0.18 (RUSTSEC-2024-0429, through
# gtk in Dioxus 0.7) and rand 0.7 (RUSTSEC-2026-0097, build time through wry)
# need no entry; `cargo audit` still lists them.
[advisories]
ignore = [
    # rsa: Marvin timing side channel. Fixed in rsa 0.10, which only ssh-key
    # 0.7 uses, and that is still a release candidate (move together with
    # p256 0.14, below). Only the desktop SSH agent signs with RSA keys, over
    # a local socket, each signature after consent. Ed25519 keys are not
    # affected.
    { id = "RUSTSEC-2023-0071", reason = "fix needs ssh-key 0.7 (release candidate); local SSH agent only" },
    # crypto-bigint 0.5 (through p256/p384 0.13 and ssh-key 0.6): timing
    # variability in big-integer arithmetic. Fixed in crypto-bigint 0.7, which
    # p256 0.14 uses, but ssh-key 0.7 is still a release candidate. P-256 is
    # used on the device only: passkey signatures after a click, SSH agent
    # signatures after consent over a local socket; the server never uses it.
    # Move to p256 0.14 and ssh-key 0.7 together once ssh-key 0.7 is out.
    { id = "RUSTSEC-2026-0387", reason = "fix needs ssh-key 0.7 (release candidate); device-local signing only" },
    # chrono: unmaintained since November 2026, no known vulnerability. The
    # app only formats local dates and the hour with it (platform.rs), and
    # zxcvbn uses it. Move to jiff once its local time zone is checked on
    # every platform the app runs on (iOS and Android in particular).
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known issue; local date formatting only" },
    # Unmaintained, no known issue: fxhash (through wry), paste and
    # proc-macro-error (compile-time macros).
    { id = "RUSTSEC-2025-0057", reason = "unmaintained; through wry" },
    { id = "RUSTSEC-2024-0436", reason = "unmaintained; compile-time macro" },
    { id = "RUSTSEC-2024-0370", reason = "unmaintained; compile-time macro through glib" },
]
