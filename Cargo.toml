[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/client",
    "crates/cli",
    "crates/server",
    "crates/app",
]

[workspace.package]
version = "1.6.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joostiphone/2Secret"
homepage = "https://github.com/joostiphone/2Secret"
authors = ["2Secret contributors"]

[workspace.dependencies]
twosecret-core = { path = "crates/core", version = "1.6.1" }
twosecret-client = { path = "crates/client", version = "1.6.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
web-time = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Only strip debug info: stripping symbols also removes the custom sections
# wasm-bindgen needs for the web and extension builds. Native release
# binaries are stripped in the release workflow (CARGO_PROFILE_RELEASE_STRIP).
strip = "debuginfo"

# Argon2 is painfully slow without optimisations; keep tests and dev builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
