name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10

jobs:
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  advisories:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Known vulnerabilities (RustSec) in Cargo.lock; deny.toml lists the
      # ones that do not apply, with the reason.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core, client, server and CLI
        run: cargo test -p twosecret-core -p twosecret-client -p twosecret-server -p twosecret-cli --features twosecret-core/ssh-agent

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p twosecret-app --release
      # Reuses the release build; a separate debug build takes >15 min on Windows.
      - run: cargo test -p twosecret-app --release

  web:
    name: Web vault (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - name: Bundle web app
        working-directory: crates/app
        run: dx bundle --platform web --release
      - uses: actions/upload-artifact@v4
        with:
          name: 2secret-web
          path: crates/app/dist/public

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - run: ./extension/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Passkeys end to end (Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          xvfb-run -a node extension/tests/passkeys.js
      - uses: actions/upload-artifact@v4
        with:
          name: 2secret-extension
          path: extension/dist

  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      # The runner image ships the Android SDK and NDK.
      - name: Build (debug signed, for testing)
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: 2secret-android-debug
          path: dist/android/*.apk

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build for iOS devices
        run: cargo build -p twosecret-app --release --target aarch64-apple-ios --no-default-features --features mobile
      - name: App and AutoFill extension for the simulator (Xcode)
        run: |
          brew install xcodegen
          scripts/ios-appstore.sh
      - name: macOS AutoFill extension (Xcode)
        working-directory: macos
        run: |
          xcodegen generate --quiet
          xcodebuild build -project TwoSecretMac.xcodeproj -target AutoFill -configuration Release ARCHS=arm64

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Nothing is needed back on the runner; copying target/ fills its disk.
          copyback: false
          prepare: pkg install -y rust pkgconf
          run: |
            cargo test -p twosecret-core -p twosecret-client -p twosecret-server
            cargo build -p twosecret-cli --no-default-features
            cargo build -p twosecret-server --release
