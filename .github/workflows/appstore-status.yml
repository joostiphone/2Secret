name: App Store status

# Shows where the iOS app's App Store versions are (waiting for review, in
# review, ready for distribution, ...), in how many countries the app is for
# sale, its price, whether the public App Store shows it yet and its App Store
# address. An approved version is only in the store where the app is for
# sale, and a day can pass before the store shows it. Start it from the
# Actions tab; the answer is in the run's summary.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: App Store status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography==50.0.2
      # The key only here, not while pip installs.
      - env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/appstore.py status'
