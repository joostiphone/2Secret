name: App Store status

# Shows where the iOS app's App Store versions are (waiting for review, in
# review, ready for sale, ...) and its App Store address. Start it from the
# Actions tab; the answer is in the run's summary.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: App Store status
    runs-on: ubuntu-latest
    env:
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/appstore.py status
