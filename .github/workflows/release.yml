name: Release

# Builds everything for a version and publishes one GitHub release with all
# downloads attached. Start it by pushing a tag like v1.2.3, or from the
# Actions tab ("Run workflow") with the version as input, which creates the
# tag on the selected branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v1.2.3 (must match Cargo.toml)"
        required: true
        type: string
      replace:
        description: "Move the tag to this commit if it exists but its release is not published (e.g. after a failed run)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  tag:
    name: Version ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Version must look like v1.2.3"; exit 1; }
          grep -q "^version = \"${TAG#v}\"" Cargo.toml || { echo "::error::Cargo.toml has a different version than $TAG"; exit 1; }
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace }}
        run: |
          existing="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$GITHUB_SHA" ]; then echo "$TAG already points at $GITHUB_SHA"; exit 0; fi
            if [ "$REPLACE" != "true" ]; then echo "::error::$TAG already exists; run again with 'replace' to move it"; exit 1; fi
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
              echo "::error::$TAG is already published and cannot be moved"; exit 1
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$TAG" -m "2Secret $TAG"
          git push -f origin "refs/tags/$TAG"

  binaries:
    name: CLI & server (${{ matrix.target }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p twosecret-cli -p twosecret-server
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - name: Package
        shell: bash
        run: |
          name=2secret-${TAG}-${{ matrix.target }}
          mkdir -p "$name" out
          cp target/${{ matrix.target }}/release/2secret${{ matrix.ext }} target/${{ matrix.target }}/release/2secret-server${{ matrix.ext }} "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "out/$name.zip" "$name"; else tar czf "out/$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-binaries-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, types: "--package-types deb --package-types appimage" }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, arch: aarch64 }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, arch: x64 }
          - { name: windows, os: windows-latest, types: "--package-types msi --package-types nsis" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - name: Bundle
        if: runner.os != 'macOS'
        working-directory: crates/app
        shell: bash
        run: dx bundle --platform desktop --release ${{ matrix.types }} --out-dir "$GITHUB_WORKSPACE/bundles"
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: crates/app
        run: |
          # dx strips the app with the toolchain's rust-objcopy, which needs
          # libLLVM, but only tells the Linux loader where to find it.
          sysroot="$(rustc --print sysroot)"
          llvm="$(find "$sysroot" -name 'libLLVM*.dylib' -print -quit)"
          if [ -z "$llvm" ]; then
            rustup component add llvm-tools
            llvm="$(find "$sysroot" -name 'libLLVM*.dylib' -print -quit)"
          fi
          mkdir -p "$RUNNER_TEMP/llvm" && ln -sf "$llvm" "$RUNNER_TEMP/llvm/libLLVM.dylib"
          DYLD_LIBRARY_PATH="$RUNNER_TEMP/llvm" dx bundle --platform desktop --release \
            --target ${{ matrix.target }} --package-types macos --out-dir "$RUNNER_TEMP/app"
      - name: Sign, notarize and package (macOS)
        if: runner.os == 'macOS'
        # Set these repository secrets to sign with a Developer ID and notarize
        # (see CONTRIBUTING.md); without them the app is signed ad hoc.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.app' -type d -print -quit)"
          dmg="$GITHUB_WORKSPACE/bundles/2Secret_${TAG#v}_${{ matrix.arch }}.dmg"
          mkdir -p "$GITHUB_WORKSPACE/bundles" "$RUNNER_TEMP/dmg"

          notarize() {
            out="$(xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --output-format json)" || true
            echo "$out"
            status="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')"
            if [ "$status" != "Accepted" ]; then
              id="$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
              [ -n "$id" ] && xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
              echo "::error::Notarization of $(basename "$1") failed: $status"
              exit 1
            fi
          }

          if [ -n "$APPLE_CERTIFICATE" ]; then
            # Developer ID certificate in a temporary keychain.
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/certificate.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain" login.keychain-db
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
            if [ -z "$identity" ]; then
              echo "::error::APPLE_CERTIFICATE contains no 'Developer ID Application' certificate"
              exit 1
            fi
            echo "Signing with: $identity"
            codesign --force --deep --options runtime --timestamp --sign "$identity" "$app"
          else
            # Without a Developer ID, sign ad hoc: a downloaded app with an
            # unsigned bundle is reported as "damaged", an ad-hoc signed one can
            # be allowed in System Settings → Privacy & Security.
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -info "$app/Contents/MacOS/"*

          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/app.zip"
            notarize "$RUNNER_TEMP/app.zip"
            xcrun stapler staple "$app"
          fi

          cp -R "$app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname 2Secret -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$dmg"

          if [ -n "$APPLE_CERTIFICATE" ]; then
            codesign --force --timestamp --sign "$identity" "$dmg"
            if [ -n "$APPLE_ID" ]; then
              notarize "$dmg"
              xcrun stapler staple "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose "$dmg"
            fi
          fi
      - name: Bundle RPM (with Fedora package names)
        if: runner.os == 'Linux'
        working-directory: crates/app
        run: |
          sed -i 's/^depends = .*/depends = ["webkit2gtk4.1", "gtk3", "libxdo", "openssl-libs"]/' Dioxus.toml
          dx bundle --platform desktop --release --package-types rpm --out-dir "$GITHUB_WORKSPACE/bundles"
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find bundles -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  web:
    name: Web vault
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - working-directory: crates/app
        run: dx bundle --platform web --release
      - run: mkdir out && tar czf "out/2secret-web-${TAG}.tar.gz" -C crates/app/dist/public .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: out/*
          if-no-files-found: error

  extension:
    name: Browser extension
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - run: ./extension/build.sh && mkdir out && cp extension/2secret-extension.zip "out/2secret-extension-${TAG}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-extension
          path: out/*
          if-no-files-found: error

  android:
    name: Android app
    needs: tag
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Signing key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No Android signing key (ANDROID_KEYSTORE_BASE64 etc.); the release has no Android app"
      - uses: actions/checkout@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@v2
        if: env.ANDROID_KEYSTORE_BASE64 != ''
      - uses: cargo-bins/cargo-binstall@main
        if: env.ANDROID_KEYSTORE_BASE64 != ''
      - if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - name: Build and sign
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/android.sh "$TAG" out
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: dist-android
          path: out/*
          if-no-files-found: error

  ios:
    name: iOS app (App Store Connect)
    needs: tag
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: App Store Connect key
        if: env.APP_STORE_CONNECT_KEY == ''
        run: echo "::warning::No App Store Connect API key (APP_STORE_CONNECT_KEY etc.); the iOS app is not uploaded"
      - uses: actions/checkout@v4
        if: env.APP_STORE_CONNECT_KEY != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.APP_STORE_CONNECT_KEY != ''
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        if: env.APP_STORE_CONNECT_KEY != ''
      - name: Build, sign and upload to TestFlight
        if: env.APP_STORE_CONNECT_KEY != ''
        run: |
          brew install xcodegen
          # Each upload needs a higher build number.
          scripts/ios-appstore.sh "$TAG" "$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))"

  release:
    name: Publish release
    needs: [tag, binaries, desktop, web, extension, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: out
          merge-multiple: true
      - name: Checksums, update manifest and release notes
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS && cd ..
          # The apps only update to a release with a valid update.json.sig
          # (docs/UPDATES.md).
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            scripts/sign-update.sh out "$TAG"
          else
            echo "::warning::No UPDATE_SIGNING_KEY secret: the release has no signed update.json, so the apps do not offer it as an update"
          fi
          awk '/^## /{if (seen) exit; seen=1; next} seen' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: ${{ !contains(env.TAG, '-') }}
          prerelease: ${{ contains(env.TAG, '-') }}
          tag_name: ${{ env.TAG }}
          name: 2Secret ${{ env.TAG }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true

  docker:
    name: Docker image
    needs: tag
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/2secret
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
