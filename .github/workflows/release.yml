name: Release

# Pushing a tag like v1.2.3 builds everything and creates one draft release
# with all downloads attached; publish it on GitHub after checking it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10

jobs:
  binaries:
    name: CLI & server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p twosecret-cli -p twosecret-server
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - name: Package
        shell: bash
        run: |
          name=2secret-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$name" out
          cp target/${{ matrix.target }}/release/2secret${{ matrix.ext }} target/${{ matrix.target }}/release/2secret-server${{ matrix.ext }} "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "out/$name.zip" "$name"; else tar czf "out/$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, types: "--package-types deb --package-types appimage" }
          - { os: macos-latest, types: "--package-types macos --package-types dmg" }
          - { os: windows-latest, types: "--package-types msi --package-types nsis" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - name: Bundle
        working-directory: crates/app
        shell: bash
        run: dx bundle --platform desktop --release ${{ matrix.types }} --out-dir "$GITHUB_WORKSPACE/bundles"
      - name: Bundle RPM (with Fedora package names)
        if: runner.os == 'Linux'
        working-directory: crates/app
        run: |
          sed -i 's/^depends = .*/depends = ["webkit2gtk4.1", "gtk3", "libxdo", "openssl-libs"]/' Dioxus.toml
          dx bundle --platform desktop --release --package-types rpm --out-dir "$GITHUB_WORKSPACE/bundles"
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find bundles -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  web:
    name: Web vault
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - working-directory: crates/app
        run: dx bundle --platform web --release
      - run: mkdir out && tar czf out/2secret-web-${GITHUB_REF_NAME}.tar.gz -C crates/app/dist/public .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/*
          if-no-files-found: error

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - run: ./extension/build.sh && mkdir out && cp extension/2secret-extension.zip out/2secret-extension-${GITHUB_REF_NAME}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: [binaries, desktop, web, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          awk '/^## /{if (seen) exit; seen=1; next} seen' CHANGELOG.md > notes.md
          cat .github/release-notes.md >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 2Secret ${{ github.ref_name }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/2secret
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
