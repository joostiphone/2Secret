name: TestFlight

# Builds the iOS app and uploads it to App Store Connect, where it appears in
# TestFlight. The Release workflow runs this for every version; start it from
# the Actions tab ("Run workflow") to upload a version again, for example
# after setting up the App Store Connect secrets (docs/APP-STORE.md). It
# then waits until Apple has processed the build and gives it its "What to
# Test" text from ios/AppStore/testflight (also with only a build number).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to upload, e.g. v1.3.0 (must match Cargo.toml of the selected branch)"
        required: true
        type: string
      build:
        description: "Only wait for the processing of this uploaded build number (no new upload)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  ios:
    name: iOS app (App Store Connect)
    if: inputs.build == ''
    runs-on: macos-latest
    outputs:
      build: ${{ steps.upload.outputs.build }}
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: App Store Connect key
        if: env.APP_STORE_CONNECT_KEY == ''
        run: echo "::warning::No App Store Connect API key (APP_STORE_CONNECT_KEY etc.); the iOS app is not uploaded"
      - uses: actions/checkout@v4
        if: env.APP_STORE_CONNECT_KEY != ''
      - name: Check version
        if: env.APP_STORE_CONNECT_KEY != ''
        run: |
          grep -q "^version = \"${TAG#v}\"" Cargo.toml || { echo "::error::Cargo.toml has a different version than $TAG"; exit 1; }
          [ -n "$APPLE_TEAM_ID" ] && [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] ||
            { echo "::error::Set all four secrets: APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_KEY"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        if: env.APP_STORE_CONNECT_KEY != ''
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        if: env.APP_STORE_CONNECT_KEY != ''
      # The app's window comes from tao 0.34 (through Dioxus 0.7), which does
      # not use the UIScene life cycle. Built with the iOS 27 SDK an app must
      # use it or it does not start (Apple TN3187), so build with Xcode 26 until
      # 2Secret moves to Dioxus 0.8 (tao 0.37). See docs/APP-STORE.md.
      - name: Xcode 26
        if: env.APP_STORE_CONNECT_KEY != ''
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2> /dev/null | grep -iv beta | sort -V | tail -1)"
          [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner; see docs/APP-STORE.md, \"iPhone Duo and Xcode 27\""; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Build, sign and upload to TestFlight
        id: upload
        if: env.APP_STORE_CONNECT_KEY != ''
        run: |
          brew install xcodegen
          # Build numbers must go up for every upload of a version.
          build="$(date -u +%Y%m%d.%H%M)"
          scripts/ios-appstore.sh "$TAG" "$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  processing:
    name: Processing by Apple
    needs: ios
    if: ${{ !cancelled() && (needs.ios.outputs.build != '' || inputs.build != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      BUILD: ${{ needs.ios.outputs.build || inputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the build is in TestFlight
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/appstore.py wait "$TAG" "$BUILD"
