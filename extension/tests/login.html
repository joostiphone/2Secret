<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <h1>Sign in</h1>
    <form method="post" action="/done" id="login">
      <label>User name <input type="text" name="user" autocomplete="username" /></label>
      <label>Password <input type="password" name="pw" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="out"></p>
  </body>
</html>
