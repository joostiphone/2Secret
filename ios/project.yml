# Xcode project for the App Store build of the iOS app, generated with
# XcodeGen (`xcodegen generate`). The app itself is Rust (crates/app), linked
# as a static library; scripts/ios-appstore.sh builds it all. For day-to-day
# development `dx serve --platform ios` is simpler.
name: TwoSecret
options:
  bundleIdPrefix: io.github.joostiphone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.11.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # Where scripts/ios-appstore.sh puts libtwosecret_app.a, and the system
    # libraries it needs (from `--print native-static-libs`).
    RUST_LIB_DIR: $(SRCROOT)/../target/aarch64-apple-ios/release
    RUST_NATIVE_LIBS: ""
targets:
  2Secret:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 2Secret
        CFBundleName: 2Secret
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        # The UIScene life cycle, which apps built with the iOS 27 SDK need;
        # tao's application delegate names the scene delegate (vendor/README.md).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: 2Secret uses Face ID to unlock your vault, so you do not have to type your master password every time.
        # Setting up verification codes from otpauth:// links and QR codes
        # (Settings → General → AutoFill & Passwords → Set Up Codes In).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.joostiphone.twosecret.otpauth
            CFBundleURLSchemes: [otpauth]
        # How App Store Connect classified 1.9.1 after its encryption
        # questions (no documentation needed), so it stops asking for every
        # build. Distribution in France needs a French encryption declaration
        # and changes this (docs/APP-STORE.md, Export compliance).
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/2Secret.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.joostiphone.twosecret]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joostiphone.twosecret
        PRODUCT_NAME: 2Secret
        # Set by scripts/ios-appstore.sh for the App Store build.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -ltwosecret_app $(RUST_NATIVE_LIBS)
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - target: AutoFill
  AutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
      # The app icon for the panel's header.
      - path: ../crates/app/assets/icon-128.png
        buildPhase: resources
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: 2Secret
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSFaceIDUsageDescription: 2Secret uses Face ID before it fills a password or passkey.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              # Verification codes (iOS 18, macOS 15).
              ProvidesOneTimeCodes: true
              ShowsConfigurationUI: true
    entitlements:
      path: AutoFill/AutoFill.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.joostiphone.twosecret]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joostiphone.twosecret.autofill
        PRODUCT_NAME: AutoFill
        PROVISIONING_PROFILE_SPECIFIER: $(AUTOFILL_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  2Secret:
    build:
      targets:
        2Secret: all
        AutoFill: all
    archive:
      config: Release
