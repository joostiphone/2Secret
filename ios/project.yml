# Xcode project for the App Store build of the iOS app, generated with
# XcodeGen (`xcodegen generate`). The app itself is Rust (crates/app), linked
# as a static library; scripts/ios-appstore.sh builds it all. For day-to-day
# development `dx serve --platform ios` is simpler.
name: TwoSecret
options:
  bundleIdPrefix: io.github.joostiphone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # Where scripts/ios-appstore.sh puts libtwosecret_app.a, and the system
    # libraries it needs (from `--print native-static-libs`).
    RUST_LIB_DIR: $(SRCROOT)/../target/aarch64-apple-ios/release
    RUST_NATIVE_LIBS: ""
targets:
  2Secret:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 2Secret
        CFBundleName: 2Secret
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nl]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: 2Secret uses Face ID to unlock your vault, so you do not have to type your master password every time.
    entitlements:
      path: App/2Secret.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.joostiphone.twosecret]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joostiphone.twosecret
        PRODUCT_NAME: 2Secret
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: $(RUST_LIB_DIR)
        OTHER_LDFLAGS: -ltwosecret_app $(RUST_NATIVE_LIBS)
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - target: AutoFill
  AutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: 2Secret
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSFaceIDUsageDescription: 2Secret uses Face ID before it fills a password or passkey.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
              ShowsConfigurationUI: true
    entitlements:
      path: AutoFill/AutoFill.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.joostiphone.twosecret]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joostiphone.twosecret.autofill
        PRODUCT_NAME: AutoFill
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  2Secret:
    build:
      targets:
        2Secret: all
        AutoFill: all
    archive:
      config: Release
