[package]
name = "twosecret-agent"
description = "Agent Access of the 2Secret password manager: the MCP server and the client of the desktop app's socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
twosecret-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Agents elsewhere: the relay on the sync server, and the browser's
# debugging port (plain ws:// on this computer, so no TLS).
twosecret-client.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
