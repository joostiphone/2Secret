[package]
name = "twosecret-client"
description = "HTTP client and sync engine for the 2Secret password manager (native and WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
twosecret-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true

# Website icons too large to keep are scaled down (apps only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }

[dev-dependencies]
tokio.workspace = true
ed25519-dalek = "2"
sha2 = "0.10"
twosecret-server = { path = "../server" }
