[package]
name = "twosecret-client"
description = "HTTP client and sync engine for the 2Secret password manager (native and WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
twosecret-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true

# Website icons too large to keep are scaled down (apps only).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
# Waiting for file access done on its own thread (vaults in storage folders).
tokio = { version = "1", default-features = false, features = ["sync"] }
# Vaults on WebDAV servers: folder listings, and fetching files side by side.
quick-xml = "0.41"
url.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio.workspace = true
# A small WebDAV server for the tests of vaults on WebDAV servers.
axum = "0.8"
ed25519-dalek = "2"
sha2 = "0.10"
twosecret-server = { path = "../server" }
