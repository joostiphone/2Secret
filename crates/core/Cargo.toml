[package]
name = "twosecret-core"
description = "Core cryptography, vault model and business logic of the 2Secret password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The desktop apps' SSH agent: SSH keys of every common kind (Ed25519, ECDSA,
# RSA), also protected with a passphrase.
ssh-agent = ["ssh-key/p256", "ssh-key/p384", "ssh-key/rsa", "ssh-key/encryption", "dep:rsa", "dep:signature"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
rand.workspace = true
web-time.workspace = true
url.workspace = true
psl = "2"
ml-kem = { version = "0.3", features = ["hazmat", "zeroize"] }
chacha20poly1305 = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
subtle = "2.5"
uuid = { version = "1", features = ["serde"] }
unicode-normalization = "0.1"
data-encoding = "2"
zxcvbn = "3"
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "rand_core"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
signature = { version = "2", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
