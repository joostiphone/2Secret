[application]
name = "2Secret"
default_platform = "desktop"
out_dir = "dist"
asset_dir = "assets"

[web.app]
title = "2Secret"

[web.resource]
style = []
script = []

[web.resource.dev]
script = []

[bundle]
identifier = "io.github.joostiphone.twosecret"
publisher = "2Secret"
icon = ["assets/icon-1024.png", "assets/icon-512.png", "assets/icon.ico"]
copyright = "2Secret contributors – MIT OR Apache-2.0"
category = "Utility"
short_description = "Free, open-source password manager"
long_description = "2Secret keeps passwords, cards, notes and other secrets end-to-end encrypted on all your devices."

# Debian/Ubuntu package names; the release workflow swaps in Fedora names for the RPM.
[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxdo3", "libssl3"]

[bundle.macos]
minimum_system_version = "11.0"

# Windows 10 and 11 ship WebView2; the installer only fetches it when missing,
# instead of embedding the 180 MB offline runtime installer.
[bundle.windows]
webview_install_mode = { EmbedBootstrapper = { silent = true } }

# Only the setup (.exe) is released: it installs 2Secret for the user and can
# update itself. These hooks remove an .msi version (up to 1.7.0) first.
[bundle.windows.nsis]
installer_hooks = "windows/installer-hooks.nsh"

# Face ID (NSFaceIDUsageDescription on iOS) for unlocking the vault.
[permissions.biometrics]
description = "2Secret uses Face ID to unlock your vault, so you do not have to type your master password every time."
