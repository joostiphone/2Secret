[package]
name = "twosecret-app"
description = "2Secret password manager app for desktop (macOS, Windows, Linux, BSD), web and iOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The bundler derives the app name ("2Secret") from the binary name, and
# "2secret" is taken by the CLI (case-insensitive file systems).
[[bin]]
name = "2-secret"
path = "src/main.rs"

[lib]
name = "twosecret_app"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:arboard", "dep:tokio", "dep:gio", "dep:gdk", "dep:libloading", "dep:rqrr", "twosecret-core/ssh-agent", "dep:libc"]
web = ["dioxus/web", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:gloo-timers", "dep:js-sys"]
# Browser extension popup (Chrome, Edge, Firefox): the web app plus autofill.
extension = ["web"]
mobile = ["dioxus/mobile", "dep:tokio"]

[dependencies]
twosecret-core.workspace = true
twosecret-client.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
dioxus = { version = "0.7", default-features = false, features = ["lib", "launch", "logger"] }
futures-channel = "0.3"
chrono = "0.4"
base64.workspace = true
# Profile photos: read what people pick, write a small JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
arboard = { version = "3", optional = true, default-features = false }
tokio = { version = "1", features = ["time", "rt", "sync"], optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Storage", "Navigator", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Location", "Clipboard", "Blob", "BlobPropertyBag", "Url", "Event", "EventTarget", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbObjectStore", "IdbTransaction", "IdbTransactionMode", "DomException"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
# Desktop: QR codes of one-time passwords on the screen.
rqrr = { version = "0.11", optional = true, default-features = false, features = ["img"] }

# Desktop: which program asks the SSH agent (Linux, macOS, BSD).
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# Opening links in the system browser (Android goes through JNI).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
webbrowser = "1"

# Unlocking with Touch ID / Face ID (keychain + LocalAuthentication) and the
# AutoFill extension's cache.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSFileManager", "NSURL", "NSArray", "NSData", "NSBundle", "NSProcessInfo"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }
block2 = "0.6"
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "block2", "ASCredentialIdentity", "ASCredentialIdentityStore", "ASCredentialServiceIdentifier", "ASOneTimeCodeCredentialIdentity", "ASPasskeyCredentialIdentity", "ASPasswordCredentialIdentity"] }

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSFileManager", "NSURL", "NSArray", "NSData", "NSProcessInfo", "NSValue"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError", "LABiometryType"] }
block2 = "0.6"
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "block2", "ASCredentialIdentity", "ASCredentialIdentityStore", "ASCredentialServiceIdentifier", "ASOneTimeCodeCredentialIdentity", "ASPasskeyCredentialIdentity", "ASPasswordCredentialIdentity"] }

# Unlocking with Windows Hello (and bringing its prompt to the front), and
# opening setup links (registry, named pipe).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }

# Linux: whether the desktop shows the tray icon (the AppIndicator library, and
# a panel for status icons, asked over D-Bus), and screenshots (GDK under X11,
# the screenshot portal under Wayland).
[target.'cfg(target_os = "linux")'.dependencies]
gio = { version = "0.18", optional = true }
gdk = { version = "0.18", optional = true }
libloading = { version = "0.7", optional = true }

# Android: storage location, language, links and downloads through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
# Screens with QR codes for the tests of `screen_qr`.
qrcode = { version = "0.14", default-features = false, features = ["image"] }
